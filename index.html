      const photos = JSON.parse(document.getElementById("photos-data").textContent);
      const dialog = document.querySelector(".viewer");
      const image = document.querySelector("[data-viewer-image]");
      const closeButton = document.querySelector("[data-close]");
      const prevButton = document.querySelector("[data-prev]");
      const nextButton = document.querySelector("[data-next]");
      let activeIndex = 0;

      const showPhoto = (index) => {
        activeIndex = (index + photos.length) % photos.length;
        image.src = photos[activeIndex].src;
        image.alt = photos[activeIndex].alt;
      };

      document.querySelectorAll("[data-open-photo]").forEach((button) => {
        button.addEventListener("click", () => {
          const index = photos.findIndex((photo) => photo.id === button.dataset.openPhoto);
          showPhoto(index);
          dialog.showModal();
        });
      });

      closeButton.addEventListener("click", () => dialog.close());
      prevButton.addEventListener("click", () => showPhoto(activeIndex - 1));
      nextButton.addEventListener("click", () => showPhoto(activeIndex + 1));

      dialog.addEventListener("click", (event) => {
        if (event.target === dialog) dialog.close();
      });

      window.addEventListener("keydown", (event) => {
        if (!dialog.open) return;
        if (event.key === "ArrowLeft") showPhoto(activeIndex - 1);
        if (event.key === "ArrowRight") showPhoto(activeIndex + 1);
      });
